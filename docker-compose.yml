services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-sculpfit_pass}
      MYSQL_DATABASE: ${DB_NAME:-sculpfit}
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init_database.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      network: host
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${DB_PASS:-sculpfit_pass}
      DB_NAME: ${DB_NAME:-sculpfit}

volumes:
  db_data:
