[pytest]
# Pytest configuration for the project
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add project root to Python path
pythonpath = .

# Coverage settings
addopts = 
    --verbose
    --cov=backend.db
    --cov=backend.clerk_auth
    --cov=backend.user_plans
    --cov=backend.custom_workouts_api
    --cov=backend.video_library_api
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    -p no:warnings

# Markers for different test types
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests with database/external services
    e2e: End-to-end tests for complete workflows
    slow: Tests that take longer to execute
    auth: Tests related to authentication
    api: Tests for API endpoints
    analyzer: Tests for video/image analysis modules

# Test discovery patterns
asyncio_mode = auto
